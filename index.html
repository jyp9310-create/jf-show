<style>
/* Unlock screen: the same late-night stage as the show, reduced to one gold-framed card. */
:root{--night:#070a22;--stage:#11183f;--line:#2d3a86;--gold:#ffc53a;--gold-deep:#d48a0c;--fire:#ff3358;--ink:#f5f2ff;--dim:#aab1e3;--bad:#ff8da1;
  --f-show:'Shrikhand',Georgia,cursive;--f-body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 520px at 50% -10%,#24318a 0%,rgba(36,49,138,0) 62%),var(--night);color:var(--ink);font-family:var(--f-body);
  display:grid;place-items:center;padding:24px 16px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.card{width:min(100%,400px);background:linear-gradient(180deg,#1b2463,var(--stage));border:3px solid var(--gold);border-radius:26px;padding:28px 24px 24px;text-align:center;
  box-shadow:0 0 0 6px #2a1a05,0 0 0 9px var(--gold-deep),0 24px 80px rgba(255,197,58,.16)}
.lock{font-size:34px;line-height:1}
h1{font-family:var(--f-show);font-weight:400;font-size:clamp(38px,11vw,52px);line-height:1;margin:10px 0 6px;color:var(--gold);transform:rotate(-3deg);
  text-shadow:0 3px 0 #b85d00,0 0 24px rgba(255,197,58,.45)}
h1 span{color:var(--fire);text-shadow:0 3px 0 #8a0020,0 0 24px rgba(255,51,88,.5)}
p{margin:0 0 18px;color:var(--dim);font-size:14px;line-height:1.55}
form{display:flex;flex-direction:column;gap:10px;text-align:left}
label{font-size:13px;color:var(--dim);font-weight:500}
input[type=password]{font:inherit;font-size:16px;color:var(--ink);background:#0a0f33;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input[type=password]:focus{outline:2px solid var(--gold);outline-offset:1px}
.remember{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer}
.remember input{width:18px;height:18px;accent-color:var(--gold)}
button{appearance:none;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;font-size:16px;color:#2a1600;cursor:pointer;
  background:linear-gradient(#ffd766,#f0a417);box-shadow:0 4px 0 #8a5300}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5300}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:3px solid #55d4ff;outline-offset:2px}
.msg{min-height:1.4em;margin:2px 0 0;font-size:13px;color:var(--bad)}
.note{margin:16px 0 0;font-size:12px;color:var(--dim)}
</style>
</head>

<script>
(() => {
  'use strict';
  const P = JSON.parse(document.getElementById('payload').textContent);
  const $ = id => document.getElementById(id);
  const msg = $('msg'), btn = $('go');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const KEY = 'jf-gate:' + P.salt.slice(0, 16); // a new build (new salt) invalidates any remembered key
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked: just don't remember */ } },
    drop(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  // forget keys left behind by older builds
  try { Object.keys(localStorage).forEach(k => { if (k.startsWith('jf-gate:') && k !== KEY) localStorage.removeItem(k); }); } catch (e) { /* ignore */ }

  if (!(window.crypto && crypto.subtle)) {
    msg.textContent = '이 브라우저에서는 열 수 없어요 (HTTPS 주소로 열어주세요). · This browser can’t unlock the page (open it over HTTPS).';
    btn.disabled = true; return;
  }

  async function derive(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function decrypt(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    return new TextDecoder().decode(plain);
  }
  // a small lock button so a remembered device can be locked again
  function withLockButton(html) {
    const lock = `<button id="jf-lock" type="button" title="이 기기에서 잠그기 · Lock this device" aria-label="이 기기에서 잠그기 · Lock this device"
      style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99;width:40px;height:40px;border-radius:50%;border:1px solid #2d3a86;background:rgba(9,13,42,.85);font-size:18px;cursor:pointer"
      onclick="try{localStorage.removeItem('${KEY}')}catch(e){};location.reload()">🔒</button>`;
    return html.includes('</body>') ? html.replace('</body>', () => lock + '</body>') : html + lock;
  }
  function show(html, remembered) {
    document.open();
    document.write(remembered ? withLockButton(html) : html);
    document.close();
  }

  // remembered on this device: open straight away
  const saved = store.get(KEY);
  if (saved) {
    crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, false, ['decrypt'])
      .then(decrypt).then(html => show(html, true))
      .catch(() => { store.drop(KEY); msg.textContent = ''; });
  }

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('pw').value;
    if (!pw) return;
    btn.disabled = true; msg.textContent = ''; btn.textContent = '여는 중… · Unlocking…';
    try {
      const key = await derive(pw);
      const html = await decrypt(key);
      const remember = $('rm').checked;
      if (remember) store.set(KEY, toB64(await crypto.subtle.exportKey('raw', key)));
      show(html, remember);
    } catch (err) {
      msg.textContent = '비밀번호가 틀렸어요. · Wrong password.';
      btn.disabled = false; btn.textContent = '열기 · Unlock';
      $('pw').select();
    }
  });
})();
</script>
</body>
